<!DOCTYPE html>
<!-- Exercise Timer v1.2 -->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Exercise Timer</title>

<style>
:root {
  --bg: #000000;
  --panel: #282a36;
  --input-bg: #1e1f29;
  --text: #f8f8f2;
  --muted: #6272a4;
  --accent: #bd93f9;
  --pink: #ff79c6;
  --cyan: #8be9fd;
  --green: #50fa7b;
  --orange: #ffb86c;
  --border: #44475a;
  --red: #ff5555;
}

* {
  box-sizing: border-box;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
}

html {
  touch-action: pan-y;
  overscroll-behavior: none;
}

body {
  margin: 0;
  min-height: 100vh;
  min-height: 100dvh;
  padding: 24px 16px;
  padding-top: max(24px, env(safe-area-inset-top));
  padding-bottom: max(24px, env(safe-area-inset-bottom));
  display: grid;
  place-items: center;
  background: var(--bg);
  color: var(--text);
  font: 16px/1.45 system-ui, sans-serif;
  touch-action: pan-y;
  overscroll-behavior: none;
}

main {
  width: min(100%, 480px);
  display: flex;
  flex-direction: column;
  gap: 16px;
}

h1 {
  font-size: 1.45rem;
  text-align: center;
  margin: 0;
  color: #ffffff;
}

.panel {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 16px;
}

.settings {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

label {
  display: block;
  color: var(--cyan);
  font-size: .88rem;
  font-weight: 600;
  margin-bottom: 8px;
}

input[type=number] {
  width: 100%;
  padding: 12px;
  border: 1px solid var(--border);
  border-radius: 10px;
  background: var(--input-bg);
  color: var(--text);
  font-size: 18px;
  font-weight: 650;
  -webkit-user-select: none;
  user-select: none;
  touch-action: manipulation;
}

input[type=number]:focus {
  outline: none;
  border-color: var(--accent);
}

input.invalid {
  border: 1px solid var(--red) !important;
  box-shadow: 0 0 0 1px var(--red);
}

.input-error {
  color: var(--red);
  font-size: 12px;
  margin-top: 5px;
  display: none;
  text-align:center;
}

.input-error.show {
  display: block;
}

.display {
  text-align: center;
  padding: 28px 18px;
}

#phase {
  font-size: .9rem;
  letter-spacing: 2px;
  font-weight: 750;
  color: var(--muted);
}

#phase.hold {
  color: var(--green);
}

#phase.rest {
  color: var(--orange);
}

#phase.complete {
  color: var(--pink);
}

#timer {
  font-size: clamp(76px, 19vw, 112px);
  line-height: 1.1;
  letter-spacing: -4px;
  font-weight: 750;
  font-variant-numeric: tabular-nums;
  margin: 12px 0;
  color: var(--text);
}

.track {
  height: 7px;
  background: var(--border);
  border-radius: 20px;
  overflow: hidden;
  margin-top: 24px;
}

#progress {
  height: 100%;
  width: 0%;
  background: var(--accent);
  transition: width .1s linear;
}

.rep-panel {
  text-align: center;
}

.rep-label {
  color: var(--cyan);
  font-size: .85rem;
  font-weight: 600;
  letter-spacing: 1px;
  text-transform: uppercase;
}

#rep-count {
  font-size: 32px;
  font-weight: 750;
  font-variant-numeric: tabular-nums;
  margin-top: 4px;
  color: var(--text);
}

.controls {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}

button {
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 16px 10px;
  font-size: 1rem;
  font-weight: 700;
  cursor: pointer;
  background: var(--panel);
  color: var(--text);
  transition: background .15s ease, border-color .15s ease;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
}

button:hover:not(:disabled) {
  border-color: var(--accent);
}

button.primary {
  background: var(--pink);
  border-color: var(--pink);
  color: #282a36;
}

button.primary:hover:not(:disabled) {
  background: var(--pink);
  border-color: var(--pink);
}

#start {
  width: 100%;
  padding: 20px;
  font-size: 1.15rem;
}

button:disabled {
  opacity: .4;
  cursor: not-allowed;
}
</style>
</head>

<body>

<main>

  <h1>Exercise Timer</h1>

  <section class="settings">

    <div class="panel">
      <label for="hold">Time (seconds)</label>
      <input
        id="hold"
        type="number"
        min="0.5"
        max="600"
        step="0.5"
        value="10"
      >
      <div id="hold-error" class="input-error">Enter desired time</div>
    </div>

    <div class="panel">
      <label for="rest">Rest (seconds)</label>
      <input
        id="rest"
        type="number"
        min="0.5"
        max="120"
        step="0.5"
        value="2"
      >
      <div id="rest-error" class="input-error">Enter desired time</div>
    </div>

  </section>

  <section class="panel">
    <label for="reps">Desired Reps</label>
    <input
      id="reps"
      type="number"
      min="1"
      max="999"
      step="1"
      value="10"
    >
  </section>

  <section class="panel display">

    <div id="phase">READY</div>

    <div id="timer">10</div>

    <div class="track">
      <div id="progress"></div>
    </div>

  </section>

  <section class="panel rep-panel">

    <div class="rep-label">Reps</div>

    <div id="rep-count">0 / 10</div>

  </section>

  <button id="start" class="primary">
    Start
  </button>

  <section class="controls">

    <button id="pause" disabled>
      Pause
    </button>

    <button id="reset">
      Reset
    </button>
  </section>
</main>

<script>

(() => {

  const $ = id => document.getElementById(id);

  let phase = 'hold';
  let remaining = 10;
  let duration = 10;

  let running = false;
  let paused = false;
  let completed = false;

  let currentRep = 0;
  let interval = null;
  let endAt = 0;


  // Read settings
  function settings() {

    return {
      hold: Math.max(
        0.5,
        Math.min(600, Number($('hold').value) || 10)
      ),

      rest: Math.max(
        0.5,
        Math.min(600, Number($('rest').value) || 2)
      ),

      reps: Math.max(
        1,
        Math.min(999, Math.floor(Number($('reps').value) || 10))
      )
    };

  }


  // Validate hold and rest inputs
  
function validateTimes() {
  const holdValue = $('hold').value.trim();
  const restValue = $('rest').value.trim();

  const holdValid =
    holdValue !== '' &&
    Number.isFinite(Number(holdValue)) &&
    Number(holdValue) >= 0.5 &&
    Number(holdValue) <= 600;

  const restValid =
    restValue !== '' &&
    Number.isFinite(Number(restValue)) &&
    Number(restValue) >= 0.5 &&
    Number(restValue) <= 600;

  $('hold').classList.toggle('invalid', !holdValid);
  $('rest').classList.toggle('invalid', !restValid);

  $('hold-error').textContent = holdValue === ''
    ? 'Enter desired time'
    : 'Enter a value from 0.5–600 seconds';

  $('rest-error').textContent = restValue === ''
    ? 'Enter desired time'
    : 'Enter a value from 0.5–600 seconds';

  $('hold-error').classList.toggle('show', !holdValid);
  $('rest-error').classList.toggle('show', !restValid);

  return holdValid && restValid;
}

// Update display
function render() {
  const timesValid = validateTimes();

  $('timer').textContent = timesValid
    ? remaining.toFixed(1).replace(/\.0$/, '')
    : '-';

  const phaseEl = $('phase');
  phaseEl.className = '';

  if (completed) {
    phaseEl.textContent = 'COMPLETE';
    phaseEl.classList.add('complete');
  } else if (!running && !paused && currentRep === 0) {
    phaseEl.textContent = 'READY';
  } else if (phase === 'hold') {
    phaseEl.textContent = 'HOLD POSITION';
    phaseEl.classList.add('hold');
  } else {
    phaseEl.textContent = 'REST';
    phaseEl.classList.add('rest');
  }

  $('rep-count').textContent =
    currentRep + ' / ' + settings().reps;

  $('progress').style.width =
    (100 * (1 - remaining / duration)) + '%';

  $('start').textContent = paused ? 'Resume' : 'Start';
  $('start').disabled = running || completed || !timesValid;

  $('pause').disabled = !running;

  $('hold').disabled = running || paused || completed;
  $('rest').disabled = running || paused || completed;
  $('reps').disabled = running || paused || completed;
}

  // Switch phases
  function switchPhase() {

    if (phase === 'hold') {

      if (currentRep >= settings().reps) {
        finish();
        return;
      }

      phase = 'rest';

      duration = settings().rest;
      remaining = duration;

    } else {

      currentRep++;

      phase = 'hold';

      duration = settings().hold;
      remaining = duration;

    }

  }


  // Timer tick
  function tick() {

    remaining = Math.max(
      0,
      (endAt - performance.now()) / 1000
    );

    if (remaining <= 0) {

      switchPhase();

      if (completed) return;

      endAt =
        performance.now() + duration * 1000;

    }

    render();

  }


  // Finish session
  function finish() {

    clearInterval(interval);

    interval = null;

    running = false;
    paused = false;
    completed = true;

    remaining = 0;

    render();

  }


  // Start / resume
  function start() {

    if (running || completed) return;

    if (!validateTimes()) return;

    if (!paused) {

      phase = 'hold';

      duration = settings().hold;
      remaining = duration;

      currentRep = 1;

    }

    paused = false;
    running = true;

    endAt =
      performance.now() + remaining * 1000;

    interval = setInterval(tick, 50);

    render();

  }


  // Pause
  function pause() {

    if (!running) return;

    remaining = Math.max(
      0,
      (endAt - performance.now()) / 1000
    );

    clearInterval(interval);

    interval = null;

    running = false;
    paused = true;

    render();

  }


  // Reset
  function reset() {

    clearInterval(interval);

    interval = null;

    running = false;
    paused = false;
    completed = false;

    phase = 'hold';

    currentRep = 0;

    duration = settings().hold;
    remaining = duration;

    render();

  }


  // Button events
  $('start').addEventListener('click', start);

  $('pause').addEventListener('click', pause);

  $('reset').addEventListener('click', reset);


  // Update settings when changed
  ['hold', 'rest', 'reps'].forEach(id => {

    $(id).addEventListener('input', () => {

      // Enforce maximum of 600 seconds
      if (id === 'hold' || id === 'rest') {

        const input = $(id);

        if (Number(input.value) > 600) {
          input.value = 600;
        }

        validateTimes();

      }

      if (!running && !paused) {
        reset();
      }

    });

  });


  // Initial display
  render();

})();

</script>
</body>
</html>
