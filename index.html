

<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Core Stability Timer</title>

<style>

:root {

  --bg: #111827;

  --panel: #1f2937;

  --text: #f9fafb;

  --muted: #9ca3af;

  --accent: #2563eb;

  --border: #374151;

}

* { box-sizing: border-box; }

body {

  margin: 0;

  min-height: 100vh;

  padding: 24px 16px;

  display: grid;

  place-items: center;

  background: var(--bg);

  color: var(--text);

  font: 16px/1.45 system-ui, sans-serif;

}

main {

  width: min(100%, 480px);

  display: flex;

  flex-direction: column;

  gap: 16px;

}

h1 {

  font-size: 1.45rem;

  text-align: center;

  margin: 0;

}

.panel {

  background: var(--panel);

  border: 1px solid var(--border);

  border-radius: 16px;

  padding: 16px;

}

.settings {

  display: grid;

  grid-template-columns: 1fr 1fr;

  gap: 12px;

}

label {

  display: block;

  color: var(--muted);

  font-size: .88rem;

  margin-bottom: 8px;

}

input[type=number] {

  width: 100%;

  padding: 12px;

  border: 1px solid var(--border);

  border-radius: 10px;

  background: var(--bg);

  color: var(--text);

  font-size: 18px;

  font-weight: 650;

}

.display {

  text-align: center;

  padding: 28px 18px;

}

#phase {

  font-size: .9rem;

  letter-spacing: 2px;

  font-weight: 750;

  color: var(--muted);

}

#timer {

  font-size: clamp(76px, 19vw, 112px);

  line-height: 1.1;

  letter-spacing: -4px;

  font-weight: 750;

  font-variant-numeric: tabular-nums;

  margin: 12px 0;

}

.track {

  height: 7px;

  background: var(--border);

  border-radius: 20px;

  overflow: hidden;

  margin-top: 24px;

}

#progress {

  height: 100%;

  width: 0%;

  background: var(--accent);

  transition: width .1s linear;

}

.rep-panel {

  text-align: center;

}

.rep-label {

  color: var(--muted);

  font-size: .85rem;

  letter-spacing: 1px;

  text-transform: uppercase;

}

#rep-count {

  font-size: 32px;

  font-weight: 750;

  font-variant-numeric: tabular-nums;

  margin-top: 4px;

}

.controls {

  display: grid;

  grid-template-columns: 1fr 1fr;

  gap: 8px;

}

button {

  border: 1px solid var(--border);

  border-radius: 12px;

  padding: 16px 10px;

  font-size: 1rem;

  font-weight: 700;

  cursor: pointer;

  background: var(--panel);

  color: var(--text);

}

button.primary {

  background: var(--accent);

  border-color: var(--accent);

  color: white;

}

#start {

  width: 100%;

  padding: 20px;

  font-size: 1.15rem;

}

button:disabled {

  opacity: .45;

  cursor: not-allowed;

}

</style>

</head>

<body>

<main>

  <h1>Core Stability Timer</h1>

  <section class="settings">

    <div class="panel">

      <label for="hold">Hold position (seconds)</label>

      <input

        id="hold"

        type="number"

        min="0.5"

        max="600"

        step="0.5"

        value="10"

      >

    </div>

    <div class="panel">

      <label for="rest">Transition (seconds)</label>

      <input

        id="rest"

        type="number"

        min="0.5"

        max="120"

        step="0.5"

        value="2"

      >

    </div>

  </section>

  <section class="panel">

    <label for="reps">Desired Reps</label>

    <input

      id="reps"

      type="number"

      min="1"

      max="999"

      step="1"

      value="10"

    >

  </section>

  <section class="panel display">

    <div id="phase">READY</div>

    <div id="timer">10</div>

    <div class="track">

      <div id="progress"></div>

    </div>

  </section>

  <section class="panel rep-panel">

    <div class="rep-label">Reps</div>

    <div id="rep-count">0 / 10</div>

  </section>

  <button id="start" class="primary">

    Start

  </button>

  <section class="controls">

    <button id="pause" disabled>

      Pause

    </button>

    <button id="reset">

      Reset

    </button>

  </section>

</main>

<script>

(() => {

  const $ = id => document.getElementById(id);

  let phase = 'hold';

  let remaining = 10;

  let duration = 10;

  let running = false;

  let paused = false;

  let completed = false;

  let currentRep = 0;

  let interval = null;

  let endAt = 0;

  // Read settings

  function settings() {

    return {

      hold: Math.max(

        0.5,

        Math.min(600, Number($('hold').value) || 10)

      ),

      rest: Math.max(

        0.5,

        Math.min(120, Number($('rest').value) || 2)

      ),

      reps: Math.max(

        1,

        Math.min(999, Math.floor(Number($('reps').value) || 10))

      )

    };

  }

  // Update display

  function render() {

    $('timer').textContent =

      remaining.toFixed(1).replace(/\.0$/, '');

    $('phase').textContent =

      completed

        ? 'COMPLETE'

        : phase === 'hold'

          ? 'HOLD POSITION'

          : phase === 'rest'

            ? 'TRANSITION'

            : 'READY';

    $('rep-count').textContent =

      currentRep + ' / ' + settings().reps;

    $('progress').style.width =

      (100 * (1 - remaining / duration)) + '%';

    $('start').textContent =

      paused ? 'Resume' : 'Start';

    $('start').disabled = running || completed;

    $('pause').disabled = !running;

    $('hold').disabled = running || paused || completed;

    $('rest').disabled = running || paused || completed;

    $('reps').disabled = running || paused || completed;

  }

  // Switch phases

  function switchPhase() {

    if (phase === 'hold') {

      phase = 'rest';

      duration = settings().rest;

      remaining = duration;

    } else {

      // A rep is completed after the transition.

      currentRep++;

      if (currentRep >= settings().reps) {

        finish();

        return;

      }

      phase = 'hold';

      duration = settings().hold;

      remaining = duration;

    }

  }

  // Timer tick

  function tick() {

    remaining = Math.max(

      0,

      (endAt - performance.now()) / 1000

    );

    if (remaining <= 0) {

      switchPhase();

      if (completed) return;

      endAt =

        performance.now() + duration * 1000;

    }

    render();

  }

  // Finish session

  function finish() {

    clearInterval(interval);

    interval = null;

    running = false;

    paused = false;

    completed = true;

    remaining = 0;

    render();

  }

  // Start / resume

  function start() {

    if (running || completed) return;

    if (!paused) {

      phase = 'hold';

      duration = settings().hold;

      remaining = duration;

      currentRep = 1;

    }

    paused = false;

    running = true;

    endAt =

      performance.now() + remaining * 1000;

    interval = setInterval(tick, 50);

    render();

  }

  // Pause

  function pause() {

    if (!running) return;

    remaining = Math.max(

      0,

      (endAt - performance.now()) / 100
